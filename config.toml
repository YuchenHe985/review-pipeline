# One run of the whole pipeline. Paths are relative to this file.
[data]
category = "Health_and_Personal_Care"
reviews = "data/raw/Health_and_Personal_Care.jsonl.gz"
meta = "data/raw/meta_Health_and_Personal_Care.jsonl.gz"
out = "out"

[ingest]
sample_rate = 1.0     # share of reviewers kept (all reviews of a kept reviewer stay together)
seed = 42

[train]
test_share = 0.2      # newest 20% of reviews are the test set
valid_share = 0.1     # newest 10% of the training period is used for early stopping
bootstrap = 1000
seed = 42

[segment]
min_reviews = 2
k_min = 2
k_max = 8
silhouette_sample = 20000
stability_seeds = 5
seed = 42
